name: Flutter Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.2'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Run analysis
      run: flutter analyze --no-fatal-infos
    
    - name: Run tests
      run: flutter test --coverage
    
    - name: Set up release signing
      env:
        KEYSTORE_BASE64: ${{ secrets.MY_PROD_CERT }}
        KEY_ALIAS: ${{ secrets.MY_KEY_ALIAS }}
        KEY_AND_STORE_PASS: ${{ secrets.MY_PROD_KEY_AND_KEYSTORE_PASS }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
        {
          echo "storePassword=$KEY_AND_STORE_PASS"
          echo "keyPassword=$KEY_AND_STORE_PASS"
          echo "keyAlias=$KEY_ALIAS"
          echo "storeFile=release-keystore.jks"
        } > android/key.properties

    - name: Build APK
      run: flutter build apk --release
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
